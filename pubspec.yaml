name: scientific_calculator
description: "A professional scientific calculator app built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  math_expressions: ^2.5.0
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.2
  pdf: ^3.10.8
  printing: ^5.13.1
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  

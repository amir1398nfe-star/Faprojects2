name: Build CafeBazaar Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Rebuild Android Directory
        run: |
          cp lib/main.dart lib/main.dart.bak || true
          cp pubspec.yaml pubspec.yaml.bak || true
          flutter create --org com.amir . --platforms=android --overwrite
          cp lib/main.dart.bak lib/main.dart || true
          cp pubspec.yaml.bak pubspec.yaml || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Generate Production Release Keystore & Sign APK
        run: |
          # 1. ساخت کلید امضای رسمی و تجاری
          keytool -genkeypair -v -keystore release.jks \
            -storepass 12345678 -keypass 12345678 \
            -alias bazaar_key -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Amir, OU=ScientificCalculator, O=Bazaar, L=Tehran, ST=Tehran, C=IR"

          # 2. پیدا کردن ابزار رسمی apksigner
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | tail -n 1)

          # 3. امضای فایل APK با کلید اصلی
          $APKSIGNER sign --ks release.jks \
            --ks-pass pass:12345678 \
            --ks-key-alias bazaar_key \
            --key-pass pass:12345678 \
            build/app/outputs/flutter-apk/app-release.apk

          # 4. تایید صحت امضا
          $APKSIGNER verify build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Cafe Bazaar APK
        uses: actions/upload-artifact@v4
        with:
          name: bazaar-app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Backup Production Keystore File
        uses: actions/upload-artifact@v4
        with:
          name: key-jks-backup
          path: release.jks

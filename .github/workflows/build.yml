name: Build CafeBazaar Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Rebuild Android Directory
        run: |
          cp lib/main.dart lib/main.dart.bak || true
          cp pubspec.yaml pubspec.yaml.bak || true
          flutter create --org com.amir . --platforms=android --overwrite
          cp lib/main.dart.bak lib/main.dart || true
          cp pubspec.yaml.bak pubspec.yaml || true

      - name: Generate Custom Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Amir, OU=Dev, O=App, L=Tehran, ST=Tehran, C=IR"
          cp ~/.android/debug.keystore android/app/key.jks

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Signed APK for Cafe Bazaar
        run: flutter build apk --release

      - name: Upload Cafe Bazaar APK
        uses: actions/upload-artifact@v4
        with:
          name: bazaar-app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Backup Keystore File
        uses: actions/upload-artifact@v4
        with:
          name: key-jks-backup
          path: android/app/key.jks
